<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Back to your MatrixOS</title>
        <style>
            body { margin: 0; padding: 32px 20px; background: #0b0d12; color: #e8ecf4;
                   font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
            main { max-width: 420px; margin: 0 auto; }
            h1 { font-size: 22px; margin: 0 0 8px; }
            p { color: #97a1b5; }
            .code { display: flex; gap: 8px; margin-top: 12px; }
            input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #242a38;
                    background: #12151d; color: #e8ecf4; font: inherit; }
            button { padding: 12px 16px; border: 0; border-radius: 10px; background: #ff4326;
                     color: #fff; font: inherit; font-weight: 600; }
            [hidden] { display: none !important; }
        </style>
    </head>
    <body>
        <main>
            <h1 id="title">Taking you back to your MatrixOS…</h1>
            <p id="text">One moment.</p>
            <div class="code" id="fallback" hidden>
                <input id="code" readonly />
                <button id="copy" type="button">Copy</button>
            </div>
        </main>
        <script>
            // ADR-0019: Spotify sends the browser here; the unit's own address
            // travels inside `state`. Only a .local name or a private address is
            // accepted, so this page cannot redirect anywhere else.
            const LOCAL =
                /^http:\/\/(matrixos-[0-9a-f]{4}\.local|localhost|127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(:\d{1,5})?$/;

            function origin(state) {
                const dot = state.lastIndexOf(".");
                if (dot < 1) return null;
                try {
                    let text = state.slice(dot + 1).replace(/-/g, "+").replace(/_/g, "/");
                    while (text.length % 4) text += "=";
                    return atob(text);
                } catch {
                    return null;
                }
            }

            const params = new URLSearchParams(location.search);
            const target = origin(params.get("state") || "");
            const code = params.get("code");
            const title = document.getElementById("title");
            const text = document.getElementById("text");

            function showCode() {
                if (!code) return;
                title.textContent = "Almost there";
                text.textContent =
                    "If your MatrixOS page did not open by itself, copy this code and paste it there.";
                document.getElementById("code").value = code;
                document.getElementById("fallback").hidden = false;
            }

            document.getElementById("copy").addEventListener("click", () => {
                navigator.clipboard.writeText(code).then(() => {
                    document.getElementById("copy").textContent = "Copied";
                });
            });

            if (target && LOCAL.test(target)) {
                window.setTimeout(showCode, 3000);
                location.replace(`${target}/spotify/callback?${params.toString()}`);
            } else {
                title.textContent = "This link did not come from a MatrixOS";
                text.textContent = "Start linking Spotify again from your MatrixOS configuration page.";
            }
        </script>
    </body>
</html>
