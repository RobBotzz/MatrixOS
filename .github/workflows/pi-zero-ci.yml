name: Raspberry Pi Zero Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{runner.os}}-aarch64-ccache

      - name: Configure CMake
        run: cmake --preset pi-zero-ci

      - name: Build Project
        run: cmake --build build-pi

      # Guards against a silently wrong toolchain: a host-architecture binary
      # would build fine here and then refuse to run on the Pi.
      - name: Verify Target Architecture
        run: |
          file build-pi/bin/MatrixOS
          file build-pi/bin/MatrixOS | grep -q 'ARM aarch64'

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pi-zero-executable
          path: build-pi/bin/
